name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install desktop test support
        run: sudo apt-get update && sudo apt-get install -y python3-tk xvfb
      - name: Install artwork support
        run: python -m pip install -r requirements.txt
      - name: Test algorithms and desktop workflows
        run: xvfb-run -a python -m unittest discover -v

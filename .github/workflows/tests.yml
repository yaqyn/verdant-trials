name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install headless graphics libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libopengl0
      - name: Install Qt desktop support
        run: python -m pip install -r requirements.txt
      - name: Verify desktop imports
        run: python -c "from PySide6.QtWidgets import QApplication; from PySide6.QtOpenGLWidgets import QOpenGLWidget; from PIL import Image"
      - name: Test algorithms and desktop workflows
        run: python -m unittest discover -v
